
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Administrativo | THEO STORE</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login">
    <h1>THEO STORE<span>.</span></h1>
    <p>Central administrativa</p>

    <form id="login-form">
      <label for="password">Senha de administrador</label>
      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
        placeholder="Digite sua senha"
      >

      <button type="submit">ENTRAR NA CENTRAL</button>
      <p id="message"></p>
    </form>

    <a href="/">Voltar para a loja</a>
  </main>
<script src="/em-desenvolvimento.js"></script>
</body>
</html>
